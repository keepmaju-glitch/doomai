<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="提款记录">
<title>提款记录管理 v27</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https: data: blob:;">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<!-- SheetJS for Excel import/export -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- Firebase via REST API - no SDK needed -->
<style>
:root{
  --bg:#0f1117;--bg2:#181b24;--bg3:#1e2130;
  --border:rgba(255,255,255,0.08);--border2:rgba(255,255,255,0.13);
  --text:#f0f2f8;--text2:#8b91a8;--text3:#555b72;
  --accent:#4f8ef7;--accent2:#3a7aee;
  --green:#34c984;--red:#f05a5a;--orange:#f0a040;
  --radius:14px;--radius-sm:8px;--nav-h:64px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;}
.app{max-width:430px;margin:0 auto;min-height:100vh;padding-top:calc(var(--nav-h) + env(safe-area-inset-top));padding-bottom:24px;}

/* HEADER */
.header{padding:20px 20px 14px;background:linear-gradient(180deg,var(--bg2) 0%,transparent 100%);}
.header-title{font-size:22px;font-weight:700;letter-spacing:-0.5px;}
.header-sub{font-size:13px;color:var(--text2);margin-top:3px;}

/* NAV */
.nav{position:fixed;top:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;height:var(--nav-h);background:rgba(24,27,36,0.94);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--border);display:flex;z-index:100;padding-top:env(safe-area-inset-top);}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:600;letter-spacing:0.3px;color:var(--text3);background:none;border:none;cursor:pointer;transition:color .2s;}
.nav-btn.active{color:var(--accent);}
.nav-btn svg{width:22px;height:22px;}

/* PAGES */
.page{display:none;padding:0 16px 20px;}
.page.active{display:block;}

/* CARDS */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.card-title{font-size:11px;font-weight:700;letter-spacing:0.8px;text-transform:uppercase;color:var(--text3);margin-bottom:14px;}

/* METRICS */
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.metric{background:var(--bg3);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;}
.metric-label{font-size:11px;color:var(--text2);margin-bottom:5px;}
.metric-value{font-size:19px;font-weight:700;color:var(--text);}
.metric-unit{font-size:10px;color:var(--text3);margin-top:2px;}
.metric.accent{border-color:rgba(79,142,247,0.3);background:rgba(79,142,247,0.08);}
.metric.accent .metric-value{color:var(--accent);}
.metric.green{border-color:rgba(52,201,132,0.3);background:rgba(52,201,132,0.08);}
.metric.green .metric-value{color:var(--green);}

/* STORE ROWS */
.store-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border);}
.store-row:last-child{border-bottom:none;}
.bar-wrap{width:100%;height:3px;background:var(--bg3);border-radius:2px;margin-top:4px;}
.bar-fill{height:3px;border-radius:2px;}

/* RECORD ITEMS */
.rec-item{padding:11px 0;border-bottom:1px solid var(--border);}
.rec-item:last-child{border-bottom:none;}
.rec-tags{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px;}
.tag{font-size:10px;padding:2px 8px;border-radius:99px;font-weight:600;border:1px solid;}

/* FORM */
.form-group{margin-bottom:14px;}
.form-label{font-size:11px;font-weight:700;letter-spacing:0.6px;text-transform:uppercase;color:var(--text2);margin-bottom:8px;display:block;}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
input[type="date"],input[type="time"],input[type="number"],input[type="text"]{
  width:100%;background:var(--bg3);border:1px solid var(--border2);
  border-radius:var(--radius-sm);color:var(--text);
  font-size:14px;padding:10px 12px;outline:none;-webkit-appearance:none;
  transition:border-color .2s;font-family:inherit;
}
input:focus{border-color:var(--accent);}
input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none;}
.si-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.si-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.si-label{font-size:12px;color:var(--text2);width:108px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.si-input{flex:1;}
.si-input input{font-size:13px;padding:8px 10px;}
.total-bar{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-top:1px solid var(--border2);margin-top:4px;}
.total-label{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--text2);}
.total-value{font-size:18px;font-weight:700;color:var(--accent);}

/* BUTTONS */
.btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:11px 16px;font-size:13px;font-weight:600;border-radius:var(--radius-sm);border:1px solid var(--border2);background:var(--bg3);color:var(--text);cursor:pointer;font-family:inherit;transition:all .15s;}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff;width:100%;padding:14px;font-size:15px;}
.btn-primary:active{background:var(--accent2);}
.btn-sm{padding:5px 12px;font-size:11px;}
.btn-danger{border-color:rgba(240,90,90,0.4);color:var(--red);background:rgba(240,90,90,0.08);}
.btn-green{border-color:rgba(52,201,132,0.4);color:var(--green);background:rgba(52,201,132,0.08);}
.btn-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}

/* MONTH TABS */
.month-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px;scrollbar-width:none;}
.month-tabs::-webkit-scrollbar{display:none;}
.m-tab{flex-shrink:0;padding:6px 14px;font-size:12px;font-weight:600;border:1px solid var(--border2);border-radius:99px;cursor:pointer;background:transparent;color:var(--text2);font-family:inherit;transition:all .15s;}
.m-tab.active{background:var(--accent);color:#fff;border-color:var(--accent);}

/* TOAST */
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(10px);background:#232736;color:var(--text);font-size:13px;font-weight:600;padding:10px 20px;border-radius:99px;opacity:0;transition:opacity .25s,transform .25s;pointer-events:none;z-index:200;white-space:nowrap;border:1px solid var(--border2);box-shadow:0 4px 20px rgba(0,0,0,.4);}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(4px);z-index:300;display:none;align-items:flex-end;justify-content:center;}
.modal-overlay.show{display:flex;}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:var(--radius) var(--radius) 0 0;padding:20px;width:100%;max-width:430px;max-height:80vh;overflow-y:auto;}
.modal-title{font-size:16px;font-weight:700;margin-bottom:16px;}
.modal-close{float:right;background:none;border:none;color:var(--text2);font-size:20px;cursor:pointer;margin-top:-4px;}

/* STORE MANAGE */
.store-manage-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);}
.store-manage-row:last-child{border-bottom:none;}
.store-color-dot{width:12px;height:12px;border-radius:3px;flex-shrink:0;}
.store-manage-name{flex:1;font-size:13px;}
.divider{height:1px;background:var(--border);margin:12px 0;}
.empty{text-align:center;padding:36px 0;color:var(--text3);font-size:13px;}
.section-label{font-size:11px;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--text3);margin:18px 0 10px;padding-left:2px;}
.month-summary{display:flex;justify-content:space-between;font-size:13px;margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid var(--border);}
.pie-legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px;}
.legend-item{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--text2);}
.legend-dot{width:8px;height:8px;border-radius:2px;flex-shrink:0;}

/* BALANCE */
.balance-card{background:linear-gradient(135deg,rgba(79,142,247,.15),rgba(52,201,132,.1));border:1px solid rgba(79,142,247,.3);border-radius:var(--radius);padding:18px;margin-bottom:12px;}
.balance-main{font-size:32px;font-weight:700;color:var(--accent);margin:6px 0 4px;}
.balance-label{font-size:12px;color:var(--text2);font-weight:600;text-transform:uppercase;letter-spacing:.5px;}
.balance-sub{font-size:12px;color:var(--text2);}

/* ACCOUNT LIST */
.acct-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);}
.acct-row:last-child{border-bottom:none;}
.acct-name{font-size:13px;font-weight:600;}
.acct-bal{font-size:14px;font-weight:700;font-variant-numeric:tabular-nums;}
.acct-init{font-size:11px;color:var(--text3);margin-top:1px;}

/* SPIN ANIMATION */
@keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

/* SYNC STATUS */
.sync-bar{position:fixed;top:var(--nav-h);left:50%;transform:translateX(-50%);width:100%;max-width:430px;z-index:99;padding:0;overflow:hidden;height:0;transition:height .25s;}
.sync-bar.show{height:28px;}
.sync-inner{display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:600;padding:5px 16px;background:rgba(24,27,36,0.97);border-bottom:1px solid var(--border2);}
.sync-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}
.sync-dot.green{background:var(--green);}
.sync-dot.orange{background:var(--orange);animation:pulse .8s infinite;}
.sync-dot.red{background:var(--red);}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.3;}}

/* TRANSACTION */
.tx-item{padding:10px 0;border-bottom:1px solid var(--border);}
.tx-item:last-child{border-bottom:none;}
.tx-type-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:99px;font-size:10px;font-weight:700;}
.tx-out{background:rgba(240,90,90,.12);color:var(--red);border:1px solid rgba(240,90,90,.3);}
.tx-in{background:rgba(52,201,132,.12);color:var(--green);border:1px solid rgba(52,201,132,.3);}
.seg-ctrl{display:flex;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:3px;gap:3px;margin-bottom:14px;}
.seg-btn{flex:1;padding:7px 4px;font-size:12px;font-weight:600;border:none;border-radius:6px;cursor:pointer;background:transparent;color:var(--text2);font-family:inherit;transition:all .15s;}
.seg-btn.active{background:var(--bg2);color:var(--text);box-shadow:0 1px 4px rgba(0,0,0,.3);}
select{width:100%;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);color:var(--text);font-size:14px;padding:10px 12px;outline:none;font-family:inherit;-webkit-appearance:none;}
select:focus{border-color:var(--accent);}
</style>
</head>
<body>
<div class="app">

<!-- NAV TOP -->
<nav class="nav">
  <button class="nav-btn active" onclick="showPage('home',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>首页
  </button>
  <button class="nav-btn" onclick="showPage('entry',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>录入
  </button>
  <button class="nav-btn" onclick="showPage('records',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>记录
  </button>
  <button class="nav-btn" onclick="showPage('balance',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>余额
  </button>
  <button class="nav-btn" onclick="showPage('chart',this)">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>分析
  </button>
</nav>

<div id="toast" class="toast"></div>

<!-- LOGIN SCREEN -->
<div id="login-screen" style="position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;">
  <div style="width:100%;max-width:360px;">
    <div style="text-align:center;margin-bottom:32px;">
      <div style="font-size:48px;margin-bottom:12px;">🔐</div>
      <div style="font-size:22px;font-weight:700;color:var(--text);">提款记录管理</div>
      <div style="font-size:13px;color:var(--text3);margin-top:6px;">请输入密码以继续</div>
    </div>
    <div class="form-group">
      <label class="form-label">密码</label>
      <input type="password" id="login-pw" placeholder="输入密码" style="font-size:16px;" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div id="login-err" style="color:var(--red);font-size:12px;margin-bottom:10px;text-align:center;min-height:18px;"></div>
    <button class="btn btn-primary" style="width:100%;padding:14px;" onclick="doLogin()">进入</button>
    <div id="login-setup" style="display:none;margin-top:20px;padding-top:20px;border-top:1px solid var(--border);">
      <div style="font-size:12px;color:var(--text3);text-align:center;margin-bottom:10px;">首次使用 · 设置新密码</div>
      <div class="form-group">
        <input type="password" id="login-pw2" placeholder="再次输入确认">
      </div>
      <button class="btn btn-green" style="width:100%;" onclick="doSetPassword()">设置密码</button>
    </div>
  </div>
</div>

<!-- CHANGE PASSWORD MODAL -->
<div class="modal-overlay" id="pw-modal">
  <div class="modal">
    <div class="modal-title">修改密码 <button class="modal-close" onclick="closeModal('pw-modal')">×</button></div>
    <div class="form-group">
      <label class="form-label">当前密码</label>
      <input type="password" id="pw-old" placeholder="输入当前密码">
    </div>
    <div class="form-group">
      <label class="form-label">新密码</label>
      <input type="password" id="pw-new" placeholder="至少4位">
    </div>
    <div class="form-group">
      <label class="form-label">确认新密码</label>
      <input type="password" id="pw-new2" placeholder="再次输入新密码">
    </div>
    <div id="pw-err" style="color:var(--red);font-size:12px;margin-bottom:8px;min-height:18px;"></div>
    <button class="btn btn-primary" style="width:100%;" onclick="doChangePw()">确认修改</button>
  </div>
</div>
<div class="sync-bar" id="sync-bar">
  <div class="sync-inner">
    <div class="sync-dot orange" id="sync-dot"></div>
    <span id="sync-status">连接中...</span>
  </div>
</div>

<!-- STORE MANAGER MODAL -->
<div class="modal-overlay" id="store-modal">
  <div class="modal">
    <div class="modal-title">管理店铺 <button class="modal-close" onclick="closeModal('store-modal')">×</button></div>
    <div id="store-list-manage"></div>
    <div class="divider"></div>
    <div class="form-group">
      <label class="form-label">添加新店铺</label>
      <div style="display:flex;gap:8px;">
        <input type="text" id="new-store-name" placeholder="店铺名称" style="flex:1;">
        <button class="btn btn-green" onclick="addStore()">添加</button>
      </div>
    </div>
  </div>
</div>

<!-- ACCOUNT MANAGER MODAL -->
<div class="modal-overlay" id="acct-modal">
  <div class="modal">
    <div class="modal-title">管理账户 <button class="modal-close" onclick="closeModal('acct-modal')">×</button></div>
    <div id="acct-list-manage"></div>
    <div class="divider"></div>
    <div class="form-group">
      <label class="form-label">添加账户</label>
      <div style="display:flex;gap:8px;margin-bottom:8px;">
        <input type="text" id="new-acct-name" placeholder="账户名称 (如 DONG)" style="flex:1;">
        <input type="text" id="new-acct-no" placeholder="账号" style="flex:1;">
      </div>
      <div style="display:flex;gap:8px;margin-bottom:8px;">
        <input type="number" id="new-acct-init" placeholder="初始余额 (IDR)" style="flex:1;">
        <input type="color" id="new-acct-color" value="#4f8ef7" style="width:48px;height:38px;border:none;border-radius:6px;padding:2px;cursor:pointer;">
      </div>
      <div style="margin-bottom:8px;">
        <label class="form-label" style="margin-bottom:6px;">选择归属店铺（可多选）</label>
        <div id="new-acct-store-list" style="display:flex;flex-wrap:wrap;gap:6px;padding:8px;background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);max-height:130px;overflow-y:auto;"></div>
      </div>
      <button class="btn btn-green" style="width:100%;" onclick="addAccount()">添加账户</button>
    </div>
  </div>
</div>

<!-- HOME PAGE -->
<div class="page active" id="page-home">
  <div class="header">
    <div class="header-title">提款记录</div>
    <div class="header-sub" id="hdr-sub">加载中...</div>
  </div>
  <div class="metric-grid" id="home-metrics">
    <div class="metric accent"><div class="metric-label">本月总提款</div><div class="metric-value" id="m-total">-</div><div class="metric-unit">IDR</div></div>
    <div class="metric"><div class="metric-label">记录天数</div><div class="metric-value" id="m-days">-</div><div class="metric-unit">天</div></div>
    <div class="metric"><div class="metric-label">日均提款</div><div class="metric-value" id="m-avg">-</div><div class="metric-unit">IDR/天</div></div>
    <div class="metric"><div class="metric-label">最大单日</div><div class="metric-value" id="m-max">-</div><div class="metric-unit">IDR</div></div>
  </div>
  <div class="card"><div class="card-title">本月各店铺</div><div id="home-stores"><div class="empty">暂无数据</div></div></div>
  <div class="card"><div class="card-title">最近记录</div><div id="home-recent"><div class="empty">暂无记录</div></div></div>
</div>

<!-- ENTRY PAGE -->
<div class="page" id="page-entry">
  <div class="header">
    <div class="header-title">录入提款</div>
    <div class="header-sub">新增每日提款记录</div>
  </div>
  <div class="card">
    <div class="form-row">
      <div class="form-group"><label class="form-label">日期</label><input type="date" id="entry-date"></div>
      <div class="form-group"><label class="form-label">时间</label><input type="time" id="entry-time"></div>
    </div>
    <div class="form-group"><label class="form-label">各店铺金额（IDR）</label><div id="store-inputs"></div></div>
    <div class="total-bar"><span class="total-label">合计</span><span class="total-value" id="entry-total">0</span></div>
    <button class="btn btn-primary" style="margin-top:12px;" onclick="saveEntry()">保存记录</button>
  </div>
  <div class="section-label">店铺管理</div>
  <button class="btn" style="width:100%;" onclick="openModal('store-modal');renderStoreMgr()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.07 4.93a10 10 0 010 14.14M4.93 4.93a10 10 0 000 14.14"/></svg>
    管理店铺（增加 / 删除）
  </button>
</div>

<!-- RECORDS PAGE -->
<div class="page" id="page-records">
  <div class="header">
    <div class="header-title">历史记录</div>
    <div class="header-sub" id="rec-count">共 0 条记录</div>
  </div>

<script>
// ─── COLORS ───────────────────────────────────────
const PALETTE=['#4f8ef7','#34c984','#f07a3a','#e05a9a','#a0c832','#f0c040','#9b6ef7','#5bbcd4','#e24b4b','#b06ef0','#2dc98e','#f06090','#40c0d0','#e8a030','#7090f0'];

// ─── STATE ────────────────────────────────────────
// ─── FIREBASE CONFIG ─────────────────────────────
const FB_URL = "https://tikum-app-default-rtdb.asia-southeast1.firebasedatabase.app";
let fbReady = false;
let saveTimer = null;
let pollTimer = null;
let lastRemoteT = 0;

// ── Firebase REST API helpers ─────────────────────
async function fbGet(path){
  const r = await fetch(FB_URL+path+'.json');
  if(!r.ok) throw new Error('fbGet '+r.status);
  return r.json();
}
async function fbSet(path, data){
  const r = await fetch(FB_URL+path+'.json', {
    method:'PUT',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });
  if(!r.ok) throw new Error('fbSet '+r.status);
  return r.json();
}
async function fbPatch(path, data){
  const r = await fetch(FB_URL+path+'.json', {
    method:'PATCH',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(data)
  });
  if(!r.ok) throw new Error('fbPatch '+r.status);
  return r.json();
}

function setSyncStatus(state, msg){
  const bar = document.getElementById('sync-bar');
  const dot = document.getElementById('sync-dot');
  const txt = document.getElementById('sync-status');
  if(!bar) return;
  dot.className = 'sync-dot ' + (state==='ok'?'green':state==='saving'?'orange':'red');
  txt.textContent = msg;
  bar.classList.add('show');
  if(state==='ok') setTimeout(()=>bar.classList.remove('show'), 2500);
}

function loadState(){
  try{return JSON.parse(localStorage.getItem('app_state')||'null');}catch(e){return null;}
}
function saveLocalBackup(){
  try{localStorage.setItem('app_state',JSON.stringify({stores,data,accounts}));}catch(e){}
}
function saveTxsLocal(){
  try{localStorage.setItem('app_txs',JSON.stringify(txs));}catch(e){}
}

// ── helper: safely convert Firebase value to array ──────────────
function fbToArr(val){
  if(!val) return [];
  if(Array.isArray(val)) return val.filter(Boolean);
  if(typeof val==='object') return Object.values(val).filter(Boolean);
  return [];
}

function saveState(){
  saveLocalBackup();
  if(!fbReady) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    setSyncStatus('saving','同步中...');
    try{
      const t = Date.now();
      // IMPORTANT: saveState does NOT write txs - txs is managed by saveTxs() separately
      // This prevents saveState from overwriting txs changes made by other devices
      // Convert data array to object for Firebase (avoids PATCH merge issues)
      const dataObj = {};
      (data||[]).forEach(d=>{ if(d&&d.date) dataObj['d'+d.date.replace(/-/g,'')]=d; });
      const storesObj = (stores||[]).reduce((o,s,i)=>{o['s'+i]=s;return o;},{});
      const accountsObj = (accounts||[]).reduce((o,a,i)=>{o['a'+i]=a;return o;},{});
      // Use PUT to fully replace these nodes (so deletions are reflected)
      const r1 = await fetch(FB_URL+'/appdata/data.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(dataObj)});
      if(!r1.ok) throw new Error('data PUT failed: '+r1.status);
      const r2 = await fetch(FB_URL+'/appdata/stores.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(stores)});
      if(!r2.ok) throw new Error('stores PUT failed: '+r2.status);
      const r3 = await fetch(FB_URL+'/appdata/accounts.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(accounts)});
      if(!r3.ok) throw new Error('accounts PUT failed: '+r3.status);
      const r = await fetch(FB_URL+'/appdata/_t.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(t)});
      console.log('[saveState] data records written:', Object.keys(dataObj).length);
      if(!r.ok) throw new Error('HTTP '+r.status);
      lastRemoteT = t;
      setSyncStatus('ok','✓ 已同步');
    } catch(e){
      setSyncStatus('red','同步失败');
      console.error('saveState error:',e);
    }
  }, 800);
}

function txsToObj(arr){
  // Convert txs array to object keyed by id for Firebase storage
  const obj={};
  (arr||[]).forEach(t=>{ if(t&&t.id) obj['t'+t.id]=t; });
  return Object.keys(obj).length ? obj : null;
}
function txsFromObj(val){
  if(!val) return [];
  if(Array.isArray(val)) return val.filter(Boolean);
  return Object.values(val).filter(Boolean).sort((a,b)=>b.id-a.id);
}
async function saveTxs(){
  saveTxsLocal();
  if(!fbReady){ setSyncStatus('red','⚠ 未连接'); return; }
  setSyncStatus('saving','同步中...');
  try{
    const t = Date.now();
    // Convert txs array to object for Firebase
    const txObj = {};
    (txs||[]).forEach(tx=>{ if(tx&&tx.id) txObj['t'+tx.id] = tx; });
    const payload = Object.keys(txObj).length > 0 ? txObj : {'placeholder':'none'};
    // Write directly to txs node
    const r = await fetch(FB_URL+'/appdata/txs.json', {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if(!r.ok){
      const errText = await r.text().catch(()=>'');
      throw new Error('HTTP '+r.status+': '+errText.slice(0,80));
    }
    // Write timestamp AFTER txs confirmed - triggers phone poll
    const tRes = await fetch(FB_URL+'/appdata/_t.json', {
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(t)
    });
    if(!tRes.ok) throw new Error('_t write failed: '+tRes.status);
    lastRemoteT = t;
    setSyncStatus('ok','✓ 已同步');
    saveLocalBackup();
    toast('✓ 交易已同步 · 手机5秒内更新');
  } catch(e){
    setSyncStatus('red','失败: '+e.message.slice(0,25));
    toast('⚠ 同步失败: '+e.message);
    console.error('saveTxs error:',e);
  }
}

function applyRemoteData(remote){
  if(!remote) return;
  if(remote.stores && fbToArr(remote.stores).length)
    stores = fbToArr(remote.stores);
  if(remote.accounts && fbToArr(remote.accounts).length){
    accounts = fbToArr(remote.accounts);
    accounts.forEach(a=>{if(!a.storeMapping)a.storeMapping=[];});
  }
  if(remote.data){
    const remoteData = typeof remote.data === 'object' && !Array.isArray(remote.data)
      ? Object.values(remote.data).filter(Boolean)
      : fbToArr(remote.data);
    if(remoteData.length){
      // Use remote data directly - it's the authoritative source
      data = remoteData.filter(r=>r&&r.date).sort((a,b)=>b.date.localeCompare(a.date));
    }
  }
  // Always update txs - use txsFromObj to handle Firebase object format
  if(remote.txs){
    const rawTxs = txsFromObj(remote.txs);
    const filtered = rawTxs.filter(t=>t && t.id && t.amount);
    // Only update txs if remote has actual data or more items than local
    if(filtered.length > 0 || txs.length === 0) txs = filtered;
  }
  saveTxsLocal();
  saveLocalBackup();
}

function rerenderAll(){
  buildStoreInputs();
  renderHome();
  renderBalance();
  renderRecords();
}

async function initFirebase(){
  setSyncStatus('saving','连接中...');
  // Test fetch connectivity first
  try{
    const testR = await fetch(FB_URL+'/.json?shallow=true');
    if(!testR.ok) throw new Error('HTTP '+testR.status);
  } catch(e){
    setSyncStatus('red','⚠ 无法连接Firebase: '+e.message);
    setTimeout(initFirebase, 5000);
    return;
  }
  try{
    const remote = await fbGet('/appdata');
    applyRemoteData(remote);
    fbReady = true;
    setSyncStatus('ok','✓ 已连接');
    rerenderAll();
    const activePage = document.querySelector('.page.active');
    if(activePage && activePage.id==='page-chart') renderCharts();
    // Start polling for remote changes every 5 seconds
    startPolling();
  } catch(e){
    fbReady = false;
    setSyncStatus('red','⚠ 离线模式');
    console.error('Firebase connect error:', e);
    // Retry in 5 seconds
    setTimeout(initFirebase, 5000);
  }
}

function startPolling(){
  clearInterval(pollTimer);
  let _txsHash = '';
  let _dataHash = '';
  pollTimer = setInterval(async ()=>{
    try{
      // Check txs for tx changes
      const txsRaw = await (await fetch(FB_URL+'/appdata/txs.json')).json();
      const txsArr = txsRaw ? Object.values(txsRaw).filter(t=>t&&t.id&&t.amount) : [];
      const txsH = txsArr.map(t=>t.id+':'+t.amount).sort().join('|');

      // Check data for withdrawal record changes
      const dataRaw = await (await fetch(FB_URL+'/appdata/data.json')).json();
      const dataArr = dataRaw ? Object.values(dataRaw).filter(Boolean) : [];
      const dataH = dataArr.map(d=>d.date+':'+(d.total||0)).sort().join('|');

      if(txsH !== _txsHash || dataH !== _dataHash){
        const changed = [];
        if(txsH !== _txsHash) changed.push('txs');
        if(dataH !== _dataHash) changed.push('data');
        console.log('[poll] changed:', changed.join(','));
        _txsHash = txsH;
        _dataHash = dataH;

        // Apply only what changed
        if(txsH !== _txsHash || true){
          // Fetch full data
          const full = await (await fetch(FB_URL+'/appdata.json')).json();
          if(full && full._t) lastRemoteT = full._t;
          applyRemoteData(full);
        }
        renderBalance();
        renderHome();
        const activePage = document.querySelector('.page.active');
        if(activePage){
          const pid = activePage.id.replace('page-','');
          if(pid==='records') renderRecords();
          if(pid==='chart') renderCharts();
        }
        setSyncStatus('ok','✓ 已同步');
        toast('✓ 数据已更新');
      }
    } catch(e){ console.log('Poll error:', e.message); }
  }, 3000);
}

let data=[...HISTORY];

// Load local backup first (instant), Firebase will override
const saved=loadState();
if(saved){
  if(saved.stores&&saved.stores.length)stores=saved.stores;
  if(saved.accounts&&saved.accounts.length)accounts=saved.accounts;
  if(saved.data&&saved.data.length){
    data=[...HISTORY];
    saved.data.forEach(r=>{
      const i=data.findIndex(d=>d.date===r.date);
      if(i>=0)data[i]=r;else data.push(r);
    });
    data.sort((a,b)=>b.date.localeCompare(a.date));
  }
}
accounts.forEach(a=>{if(!a.storeMapping)a.storeMapping=[];});

function getColor(i){return PALETTE[i%PALETTE.length];}

function fmt(n){if(n>=1e9)return(n/1e9).toFixed(2)+'B';if(n>=1e6)return(n/1e6).toFixed(1)+'M';if(n>=1e3)return(n/1e3).toFixed(0)+'K';return n.toString();}
function fmtFull(n){return new Intl.NumberFormat('id-ID').format(Math.round(n));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);}
function openModal(id){document.getElementById(id).classList.add('show');}
function closeModal(id){document.getElementById(id).classList.remove('show');}

function showPage(name,btn){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('page-'+name).classList.add('active');btn.classList.add('active');
  if(name==='home')renderHome();
  if(name==='records')renderRecords();
  if(name==='balance')renderBalance();
  if(name==='chart')renderCharts();
}

// ─── STORE MANAGER ───────────────────────────────
function renderStoreMgr(){
  document.getElementById('store-list-manage').innerHTML=stores.map((s,i)=>`
    <div class="store-manage-row">
      <div class="store-color-dot" style="background:${getColor(i)}"></div>
      <div class="store-manage-name">${s}</div>
      <button class="btn btn-danger btn-sm" onclick="removeStore(${i})">删除</button>
    </div>`).join('');
}
function addStore(){
  const n=document.getElementById('new-store-name').value.trim();
  if(!n){toast('⚠️ 请输入店铺名称');return;}
  if(stores.includes(n)){toast('⚠️ 店铺已存在');return;}
  stores.push(n);saveState();
  document.getElementById('new-store-name').value='';
  renderStoreMgr();buildStoreInputs();toast('✓ 已添加：'+n);
}
function removeStore(i){
  if(!confirm('确认删除店铺：'+stores[i]+'？\n（历史数据中该店铺的数据不会被删除）'))return;
  stores.splice(i,1);saveState();renderStoreMgr();buildStoreInputs();toast('已删除');
}

// ─── ACCOUNT MANAGER ─────────────────────────────
function renderAcctMgr(){
  // All stores currently assigned
  const assignedStores=new Set(accounts.flatMap(a=>a.storeMapping||[]));
  const unassigned=stores.filter(s=>!assignedStores.has(s));

  document.getElementById('acct-list-manage').innerHTML=accounts.map((a,i)=>`
    <div style="background:var(--bg3);border:1px solid var(--border2);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px;">
        <div style="width:10px;height:10px;border-radius:3px;background:${a.color};flex-shrink:0;"></div>
        <div style="font-size:13px;font-weight:700;flex:1;">${a.name}</div>
        <div style="font-size:11px;color:var(--text3);">账号: ${a.acctNo}</div>
        <button class="btn btn-danger btn-sm" onclick="removeAccount(${i})">删除</button>
      </div>
      <div style="font-size:11px;color:var(--text2);margin-bottom:6px;">
        初始余额：<input type="number" value="${a.initBalance}" style="width:130px;font-size:12px;padding:4px 8px;display:inline-block;" onchange="accounts[${i}].initBalance=parseInt(this.value)||0;saveState();renderBalance();">
      </div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:4px;">归属店铺：</div>
      <div style="display:flex;flex-wrap:wrap;gap:4px;">
        ${(a.storeMapping||[]).map(s=>`<span style="font-size:10px;padding:2px 8px;border-radius:99px;background:${a.color}22;color:${a.color};border:1px solid ${a.color}44;display:flex;align-items:center;gap:4px;">
          ${s} <span onclick="removeStoreFromAccount(${i},'${s}')" style="cursor:pointer;opacity:.6;">×</span>
        </span>`).join('')}
      </div>

function buildStoreInputs(){
  document.getElementById('store-inputs').innerHTML=stores.map((s,i)=>`
    <div class="si-row">
      <span class="si-dot" style="background:${getColor(i)}"></span>
      <span class="si-label">${s}</span>
      <div class="si-input"><input type="number" id="si-${i}" placeholder="0" min="0" oninput="calcTotal()"/></div>
    </div>`).join('');
}
function calcTotal(){
  let t=0;stores.forEach((_,i)=>{t+=parseInt(document.getElementById('si-'+i)?.value||0)||0;});
  document.getElementById('entry-total').textContent=fmtFull(t);
}
function initEntry(){
  const now=new Date();
  document.getElementById('entry-date').value=now.toISOString().slice(0,10);
  document.getElementById('entry-time').value=now.toTimeString().slice(0,5);
  buildStoreInputs();
}
function saveEntry(){
  const date=document.getElementById('entry-date').value;
  const time=document.getElementById('entry-time').value;
  if(!date){toast('⚠️ 请填写日期');return;}
  const st={};let total=0;
  stores.forEach((s,i)=>{const v=parseInt(document.getElementById('si-'+i)?.value||0)||0;if(v>0){st[s]=v;total+=v;}});
  if(total===0){toast('⚠️ 请至少填写一家店铺');return;}
  const entry={date,time,stores:st,total};
  const idx=data.findIndex(d=>d.date===date);
  if(idx>=0)data[idx]=entry;else data.push(entry);
  data.sort((a,b)=>b.date.localeCompare(a.date));
  saveState();
  stores.forEach((_,i)=>{if(document.getElementById('si-'+i))document.getElementById('si-'+i).value='';});
  calcTotal();toast('✓ 记录已保存');
}

// ─── EDIT RECORD ─────────────────────────────────
let editingDate = null;

function openEditModal(date){
  const rec = data.find(d=>d.date===date);
  if(!rec){toast('⚠ 记录不存在');return;}
  editingDate = date;
  document.getElementById('edit-date').value = rec.date;
  document.getElementById('edit-time').value = rec.time||'';
  // Build store inputs
  const cont = document.getElementById('edit-store-inputs');
  cont.innerHTML = stores.map(s=>`
    <div class="store-row">
      <label class="store-label">${s}</label>
      <input type="number" class="store-input" data-store="${s}" value="${rec.stores[s]||0}" min="0"
        oninput="updateEditTotal()">
    </div>`).join('');
  updateEditTotal();
  openModal('edit-modal');
}

function updateEditTotal(){
  const inputs = document.querySelectorAll('#edit-store-inputs .store-input');
  const total = [...inputs].reduce((s,i)=>s+(parseInt(i.value)||0),0);
  document.getElementById('edit-total').textContent = fmtFull(total);
}

function saveEdit(){
  const date = document.getElementById('edit-date').value;
  const time = document.getElementById('edit-time').value;
  if(!date){toast('⚠ 请填写日期');return;}
  const inputs = document.querySelectorAll('#edit-store-inputs .store-input');
  const newStores = {};
  inputs.forEach(i=>{const v=parseInt(i.value)||0;if(v>0)newStores[i.dataset.store]=v;});
  const total = Object.values(newStores).reduce((s,v)=>s+v,0);
  // Remove old record (may have changed date)
  data = data.filter(d=>d.date!==editingDate);
  // Find if new date already exists
  const existIdx = data.findIndex(d=>d.date===date);
  if(existIdx>=0){
    // Merge stores into existing record
    Object.entries(newStores).forEach(([s,v])=>{data[existIdx].stores[s]=v;});
    data[existIdx].total = Object.values(data[existIdx].stores).reduce((s,v)=>s+v,0);
    data[existIdx].time = time;
  } else {
    data.push({date,time,stores:newStores,total});
  }
  data.sort((a,b)=>b.date.localeCompare(a.date));
  saveState();
  closeModal('edit-modal');
  renderRecords();
  renderHome();
  renderBalance();
  toast('✓ 记录已更新');
}

// ─── EXPORT EXCEL ─────────────────────────────────
function exportExcel(){
  try{
    const wb=XLSX.utils.book_new();
    // Get all unique store names across all records
    const allStores=[...new Set(data.flatMap(d=>Object.keys(d.stores)))];
    
    // Group by year
    const years=[...new Set(data.map(d=>d.date.slice(0,4)))];
    years.forEach(yr=>{
      const rows=data.filter(d=>d.date.startsWith(yr)).sort((a,b)=>a.date.localeCompare(b.date));
      const header=['日期','时间',...allStores,'合计'];
      const sheetData=[header,...rows.map(r=>[
        r.date,r.time||'',...allStores.map(s=>r.stores[s]||0),r.total
      ])];
      // Add monthly totals
      const months=[...new Set(rows.map(r=>r.date.slice(0,7)))];
      months.forEach(m=>{
        const mRows=rows.filter(r=>r.date.startsWith(m));
        const mTotals=allStores.map(s=>mRows.reduce((sum,r)=>sum+(r.stores[s]||0),0));
        const mTotal=mRows.reduce((sum,r)=>sum+r.total,0);
        sheetData.push([m+'月合计','',...mTotals,mTotal]);
      });
      const ws=XLSX.utils.aoa_to_sheet(sheetData);
      // Column widths
      ws['!cols']=[{wch:12},{wch:8},...allStores.map(()=>({wch:16})),{wch:14}];
      XLSX.utils.book_append_sheet(wb,ws,yr+'年');
    });

    // Account balance sheet
    const totalW=data.reduce((s,d)=>s+d.total,0);
    const balData=[
      ['账户名称','初始余额','累计到账','当前余额'],
      ...accounts.map(a=>[
        a.name,a.initBalance,Math.round(totalW/accounts.length),
        a.initBalance+Math.round(totalW/accounts.length)
      ]),
      ['合计','','',accounts.reduce((s,a)=>s+a.initBalance+Math.round(totalW/accounts.length),0)]
    ];
    const bws=XLSX.utils.aoa_to_sheet(balData);
    bws['!cols']=[{wch:16},{wch:16},{wch:16},{wch:16}];
    XLSX.utils.book_append_sheet(wb,bws,'账户余额');

    XLSX.writeFile(wb,'提款记录_'+new Date().toISOString().slice(0,10)+'.xlsx');
    toast('✓ 导出成功');
  }catch(e){toast('❌ 导出失败：'+e.message);}
}

// ─── IMPORT EXCEL ─────────────────────────────────
function importExcel(event){
  const file=event.target.files[0];
  if(!file)return;
  const reader=new FileReader();
  reader.onload=function(e){
    try{
      const wb=XLSX.read(e.target.result,{type:'array'});
      let imported=0,skipped=0;
      wb.SheetNames.forEach(sn=>{
        if(sn==='账户余额')return;
        const ws=wb.Sheets[sn];
        const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
        if(rows.length<2)return;
        const header=rows[0];
        const dateIdx=header.indexOf('日期');
        const timeIdx=header.indexOf('时间');
        const totalIdx=header.findIndex(h=>h==='合计'||h==='total');
        if(dateIdx<0)return;
        // Store columns: between time and total
        const storeStart=timeIdx>=0?timeIdx+1:dateIdx+1;
        const storeEnd=totalIdx>=0?totalIdx:header.length;
        const storeCols=header.slice(storeStart,storeEnd);

        rows.slice(1).forEach(row=>{
          const rawDate=row[dateIdx];
          if(!rawDate||String(rawDate).includes('月合计'))return;
          // Parse date
          let dateStr='';
          if(typeof rawDate==='number'){
            // Excel serial date
            const d=new Date(Math.round((rawDate-25569)*86400*1000));
            dateStr=d.toISOString().slice(0,10);
          } else {
            const m=String(rawDate).match(/(\d{4})[\-\/](\d{1,2})[\-\/](\d{1,2})/);
            if(m)dateStr=`${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
          }
          if(!dateStr)return;
          const st={};let total=0;
          storeCols.forEach((s,i)=>{
            const v=parseInt(row[storeStart+i])||0;
            if(v>0){st[s]=v;total+=v;}
          });
          if(total===0)return;
          // Add new stores
          storeCols.forEach(s=>{if(s&&!stores.includes(s))stores.push(s);});
          const entry={date:dateStr,time:String(row[timeIdx]||'12:00').slice(0,5),stores:st,total};
          const idx=data.findIndex(d=>d.date===dateStr);
          if(idx>=0){data[idx]=entry;skipped++;}else{data.push(entry);imported++;}
        });
      });
      data.sort((a,b)=>b.date.localeCompare(a.date));
      saveState();buildStoreInputs();renderRecords();renderHome();
      toast(`✓ 导入完成：新增${imported}条，更新${skipped}条`);
    }catch(err){toast('❌ 导入失败：'+err.message);}
    event.target.value='';
  };
  reader.readAsArrayBuffer(file);
}

// ─── CHARTS ──────────────────────────────────────
let tC,pC,mC,cM='';
const storeTrendCharts={};
let activeTrendStores=new Set();

function renderCharts(){
  const months=[...new Set(data.map(d=>d.date.slice(0,7)))].sort().reverse();
  if(!cM||!months.includes(cM))cM=months[0]||'';
  document.getElementById('chart-tabs').innerHTML=months.map(m=>`<div class="m-tab ${m===cM?'active':''}" onclick="cM='${m}';renderCharts()">${m.replace('-','年')}月</div>`).join('');
  const filtered=data.filter(d=>d.date.startsWith(cM)).sort((a,b)=>a.date.localeCompare(b.date));
  const gc='rgba(255,255,255,0.06)',tc='#555b72';
  if(tC)tC.destroy();
  tC=new Chart(document.getElementById('trendChart'),{type:'line',data:{labels:filtered.map(d=>d.date.slice(5)),datasets:[{data:filtered.map(d=>d.total),borderColor:'#4f8ef7',backgroundColor:'rgba(79,142,247,0.1)',fill:true,tension:0.3,pointRadius:3,pointBackgroundColor:'#4f8ef7'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:tc,font:{size:10},autoSkip:true,maxTicksLimit:10},grid:{color:gc}},y:{ticks:{color:tc,font:{size:10},callback:v=>fmt(v)},grid:{color:gc}}}}});

  const st={};
  filtered.forEach(d=>Object.entries(d.stores).forEach(([s,v])=>{st[s]=(st[s]||0)+v;}));
  const active=Object.entries(st).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);
  const ptotal=active.reduce((s,[,v])=>s+v,0);
  const aColors=active.map(([s])=>{const ci=stores.indexOf(s);return getColor(ci>=0?ci:8);});
  if(pC)pC.destroy();
  pC=new Chart(document.getElementById('pieChart'),{type:'doughnut',data:{labels:active.map(([s])=>s),datasets:[{data:active.map(([,v])=>v),backgroundColor:aColors,borderWidth:2,borderColor:'#0f1117'}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},cutout:'60%'}});
  document.getElementById('pie-legend').innerHTML=active.map(([s,v],i)=>`<div class="legend-item"><div class="legend-dot" style="background:${aColors[i]}"></div>${s} ${ptotal?(v/ptotal*100).toFixed(0):0}%</div>`).join('');

  const allM=[...new Set(data.map(d=>d.date.slice(0,7)))].sort();
  const mTotals=allM.map(m=>data.filter(d=>d.date.startsWith(m)).reduce((s,d)=>s+d.total,0));
  if(mC)mC.destroy();
  mC=new Chart(document.getElementById('monthChart'),{type:'bar',data:{labels:allM.map(m=>m.slice(2).replace('-','/')),datasets:[{data:mTotals,backgroundColor:allM.map(m=>m===cM?'#4f8ef7':'rgba(79,142,247,0.25)'),borderRadius:6}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:tc,font:{size:10}},grid:{color:gc}},y:{ticks:{color:tc,font:{size:10},callback:v=>fmt(v)},grid:{color:gc}}}}});

  renderStoreTrends();
}

function renderStoreTrends(){
  // Build last 30 calendar days
  const today=new Date();
  const days=[];
  for(let i=29;i>=0;i--){
    const d=new Date(today);d.setDate(today.getDate()-i);
    days.push(d.toISOString().slice(0,10));
  }
  const labels=days.map(d=>d.slice(5)); // MM-DD

  // Collect all stores that appear in the 30-day window
  const window30=data.filter(d=>days.includes(d.date));
  const storesIn30=new Set(window30.flatMap(d=>Object.keys(d.stores)));
  // Sort by total desc
  const storeList=[...storesIn30].sort((a,b)=>{
    const ta=window30.reduce((s,d)=>s+(d.stores[a]||0),0);
    const tb=window30.reduce((s,d)=>s+(d.stores[b]||0),0);
    return tb-ta;
  });

  // Init activeTrendStores on first render (top 4)
  if(activeTrendStores.size===0){
    storeList.slice(0,4).forEach(s=>activeTrendStores.add(s));
  }
  // Remove stores no longer in 30-day window
  [...activeTrendStores].forEach(s=>{if(!storesIn30.has(s))activeTrendStores.delete(s);});

  // Render filter pills
  const gc='rgba(255,255,255,0.06)',tc='#555b72';
  document.getElementById('store-trend-filter').innerHTML=storeList.map((s,i)=>{
    const c=getColor(stores.indexOf(s)>=0?stores.indexOf(s):i);
    const on=activeTrendStores.has(s);
    return `<button onclick="toggleTrendStore('${s.replace(/'/g,"\'")}')" style="font-size:10px;padding:3px 10px;border-radius:99px;border:1px solid ${c}55;background:${on?c+'22':'transparent'};color:${on?c:'var(--text3)'};cursor:pointer;font-family:inherit;font-weight:600;transition:all .15s;">${s}</button>`;
  }).join('');

  // Render one mini-chart per active store
  const container=document.getElementById('store-trend-charts');
  const activeList=[...activeTrendStores];

  if(!activeList.length){
    container.innerHTML='<div class="empty">请选择店铺</div>';
    // destroy leftover charts
    Object.keys(storeTrendCharts).forEach(k=>{storeTrendCharts[k].destroy();delete storeTrendCharts[k];});
    return;
  }

  // Build HTML slots for each active store (keep existing canvases where possible)
  container.innerHTML=activeList.map((s,i)=>{
    const ci=stores.indexOf(s);const c=getColor(ci>=0?ci:i);
    const vals=days.map(d=>{const rec=data.find(r=>r.date===d);return rec?(rec.stores[s]||0):null;});
    const total=vals.reduce((sum,v)=>sum+(v||0),0);
    const nonZero=vals.filter(v=>v>0);
    const avg=nonZero.length?total/nonZero.length:0;
    const peak=nonZero.length?Math.max(...nonZero):0;
    return `<div style="margin-bottom:18px;">
      <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:6px;">
        <div style="display:flex;align-items:center;gap:7px;">
          <div style="width:8px;height:8px;border-radius:50%;background:${c};flex-shrink:0;"></div>
          <span style="font-size:12px;font-weight:700;color:${c};">${s}</span>
        </div>
        <div style="text-align:right;">
          <span style="font-size:11px;color:var(--text2);">30天合计 </span>
          <span style="font-size:12px;font-weight:700;color:${c};">${fmt(total)}</span>
          <span style="font-size:10px;color:var(--text3);margin-left:6px;">均 ${fmt(Math.round(avg))} 峰 ${fmt(peak)}</span>
        </div>
      </div>
      <div style="position:relative;height:80px;"><canvas id="stc-${i}"></canvas></div>
    </div>`;
  }).join('');

  // Destroy old charts not needed
  Object.keys(storeTrendCharts).forEach(k=>{
    if(!activeList.find((_,i)=>'stc-'+i===k)){storeTrendCharts[k].destroy();delete storeTrendCharts[k];}
  });

  // Draw each chart
  activeList.forEach((s,i)=>{
    const ci=stores.indexOf(s);const c=getColor(ci>=0?ci:i);
    const vals=days.map(d=>{const rec=data.find(r=>r.date===d);return rec?(rec.stores[s]||0):null;});
    const cid='stc-'+i;
    const canvas=document.getElementById(cid);
    if(!canvas)return;
    if(storeTrendCharts[cid])storeTrendCharts[cid].destroy();
    storeTrendCharts[cid]=new Chart(canvas,{
      type:'bar',
      data:{
        labels,
        datasets:[
          {type:'bar',data:vals,backgroundColor:vals.map(v=>v>0?c+'99':c+'11'),borderRadius:3,barPercentage:0.7},
          {type:'line',data:vals.map((v,idx)=>{
            // 7-day rolling average
            const w=vals.slice(Math.max(0,idx-3),idx+4).filter(x=>x!==null&&x>0);
            return w.length?w.reduce((a,b)=>a+b,0)/w.length:null;
          }),borderColor:c,borderWidth:1.5,pointRadius:0,tension:0.4,fill:false,spanGaps:true}
        ]
      },
      options:{
        responsive:true,maintainAspectRatio:false,
        plugins:{legend:{display:false},tooltip:{callbacks:{label:ctx=>ctx.raw>0?fmtFull(ctx.raw)+' IDR':'-'}}},
        scales:{
          x:{ticks:{color:tc,font:{size:9},autoSkip:true,maxTicksLimit:10},grid:{color:gc}},
          y:{ticks:{color:tc,font:{size:9},callback:v=>fmt(v)},grid:{color:gc},beginAtZero:true}
        }
      }
    });
  });
}

function toggleTrendStore(s){
  if(activeTrendStores.has(s))activeTrendStores.delete(s);
  else activeTrendStores.add(s);
  renderStoreTrends();
}


// ─── TRANSACTIONS ────────────────────────────────
// txs: [{id, acctId, type:'out'|'in', date, time, amount, note}]
let txs = [];
let txEditType = 'out';

function loadTxs(){
  try{ return JSON.parse(localStorage.getItem('app_txs')||'[]'); }catch(e){ return []; }
}
function saveTxs(){
  try{ localStorage.setItem('app_txs', JSON.stringify(txs)); }catch(e){}
}
// txs loaded from local backup, Firebase will sync
const _savedTxs = loadTxs();
if(_savedTxs && _savedTxs.length) txs = _savedTxs;

function setTxType(t){
  txEditType = t;
  document.getElementById('seg-out').classList.toggle('active', t==='out');
  document.getElementById('seg-in').classList.toggle('active', t==='in');
}

function openTxModal(acctId){
  const now = new Date();
  document.getElementById('tx-date').value = now.toISOString().slice(0,10);
  document.getElementById('tx-time').value = now.toTimeString().slice(0,5);
  document.getElementById('tx-amount').value = '';
  document.getElementById('tx-note').value = '';
  setTxType('out');
  // Populate account dropdown
  const sel = document.getElementById('tx-acct');
  sel.innerHTML = accounts.map(a => `<option value="${a.id}"${a.id===acctId?' selected':''}>${a.name} (${a.acctNo})</option>`).join('');
  openModal('tx-modal');
}

async function saveTx(){
  const acctId = parseInt(document.getElementById('tx-acct').value);
  const date = document.getElementById('tx-date').value;
  const time = document.getElementById('tx-time').value;
  const amount = parseInt(document.getElementById('tx-amount').value)||0;
  const note = document.getElementById('tx-note').value.trim();
  if(!date){ toast('⚠️ 请填写日期'); return; }
  if(amount<=0){ toast('⚠️ 请填写金额'); return; }
  if(!acctId){ toast('⚠️ 请选择账户'); return; }
  const newTx = { id: Date.now(), acctId, type: txEditType, date, time, amount, note };
  txs.push(newTx);
  txs.sort((a,b) => b.date.localeCompare(a.date) || b.id - a.id);
  saveTxsLocal();
  closeModal('tx-modal');
  renderBalance();
  toast(txEditType==='out' ? '✓ 支出已记录' : '✓ 收入已记录');
  // Direct Firebase write - bypass all debounce
  if(fbReady){
    setSyncStatus('saving','同步中...');
    try{
      const txObj = {};
      txs.forEach(tx=>{ if(tx&&tx.id) txObj['t'+tx.id]=tx; });
      const t = Date.now();
      await fetch(FB_URL+'/appdata/txs.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(txObj)});
      await fetch(FB_URL+'/appdata/_t.json',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(t)});
      lastRemoteT = t;
      setSyncStatus('ok','✓ 已同步');
      saveLocalBackup();
    } catch(e){
      setSyncStatus('red','同步失败:'+e.message);
      console.error('saveTx sync error:',e);
    }
  }
}

async function delTx(id){
  if(!confirm('确认删除此交易记录？')) return;
  txs = txs.filter(t => t.id !== id);
  renderBalance();
  toast('已删除');
  await saveTxs();
}

// Helper: compute net transactions for an account
function acctTxNet(acctId){
  return txs.filter(t=>t.acctId===acctId).reduce((s,t)=> t.type==='in' ? s+t.amount : s-t.amount, 0);
}
function acctTxOut(acctId){
  return txs.filter(t=>t.acctId===acctId&&t.type==='out').reduce((s,t)=>s+t.amount,0);
}
function acctTxIn(acctId){
  return txs.filter(t=>t.acctId===acctId&&t.type==='in').reduce((s,t)=>s+t.amount,0);
}

// ─── FORCE SYNC ──────────────────────────────────
async function forceSyncAll(){
  if(!fbReady){ toast('⚠ Firebase未连接'); return; }
  setSyncStatus('saving','强制同步中...');
  try{
    const t = Date.now();
    const txObj = {};
    (txs||[]).forEach(tx=>{ if(tx&&tx.id) txObj['t'+tx.id]=tx; });
    const payload = {
      stores: stores,
      accounts: accounts,
      data: data,
      txs: Object.keys(txObj).length>0 ? txObj : null,
      _t: t
    };
    const r = await fetch(FB_URL+'/appdata.json',{
      method:'PUT',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify(payload)
    });
    if(!r.ok){
      const txt = await r.text().catch(()=>'');
      throw new Error('HTTP '+r.status+': '+txt.slice(0,100));
    }
    lastRemoteT = t;
    saveLocalBackup();
    setSyncStatus('ok','✓ 强制同步完成');
    toast('✓ 所有数据已同步到云端！');
  } catch(e){
    setSyncStatus('red','同步失败');
    toast('⚠ 同步失败: '+e.message);
    console.error('forceSyncAll error:',e);
  }
}

// ─── REFRESH ─────────────────────────────────────
async function refreshData(){
  const icon = document.getElementById('refresh-icon');
  if(icon) icon.style.animation='spin 0.8s linear infinite';
  setSyncStatus('saving','刷新中...');
  try{
    const remote = await fbGet('/appdata');
    applyRemoteData(remote);
    if(remote && remote._t) lastRemoteT = remote._t;
    if(icon) icon.style.animation='';
    setSyncStatus('ok','✓ 已刷新');
    rerenderAll(); buildStoreInputs();
    toast('✓ 数据已刷新');
  } catch(e){
    if(icon) icon.style.animation='';
    setSyncStatus('red','刷新失败');
    toast('⚠ 刷新失败，请检查网络');
  }
}

// ─── PASSWORD / LOGIN ────────────────────────────
const PW_KEY = 'app_pw_hash';

function hashPw(pw){
  // Simple hash - XOR fold with djb2
  let h = 5381;
  for(let i=0;i<pw.length;i++) h = ((h<<5)+h)^pw.charCodeAt(i);
  return (h>>>0).toString(36);
}

function getSavedPw(){
  return localStorage.getItem(PW_KEY);
}

function initLogin(){
  const saved = getSavedPw();
  const screen = document.getElementById('login-screen');
  const setup = document.getElementById('login-setup');
  if(!saved){
    // No password set yet - show setup mode
    setup.style.display='block';
    document.querySelector('#login-screen .form-group input').placeholder='设置新密码';
  }
  screen.style.display='flex';
  setTimeout(()=>document.getElementById('login-pw').focus(),100);
}

function doLogin(){
  const pw = document.getElementById('login-pw').value;
  const saved = getSavedPw();
  const err = document.getElementById('login-err');
  if(!pw){ err.textContent='请输入密码'; return; }
  if(!saved){
    err.textContent='请先设置密码（见下方）';
    document.getElementById('login-setup').style.display='block';
    return;
  }
  if(hashPw(pw) !== saved){
    err.textContent='密码错误，请重试';
    document.getElementById('login-pw').value='';
    document.getElementById('login-pw').focus();
    return;
  }
  // Login success
  document.getElementById('login-screen').style.display='none';
  document.getElementById('login-pw').value='';
  err.textContent='';
}

function doSetPassword(){
  const pw = document.getElementById('login-pw').value;
  const pw2 = document.getElementById('login-pw2').value;
  const err = document.getElementById('login-err');
  if(!pw || pw.length<4){ err.textContent='密码至少4位'; return; }
  if(pw !== pw2){ err.textContent='两次密码不一致'; return; }
  localStorage.setItem(PW_KEY, hashPw(pw));
  document.getElementById('login-screen').style.display='none';
  document.getElementById('login-pw').value='';
  document.getElementById('login-pw2').value='';
  err.textContent='';
  toast('✓ 密码设置成功');
}

function lockApp(){
  document.getElementById('login-pw').value='';
  document.getElementById('login-err').textContent='';
  document.getElementById('login-screen').style.display='flex';
  setTimeout(()=>document.getElementById('login-pw').focus(),100);
}

function doChangePw(){
  const oldPw = document.getElementById('pw-old').value;
  const newPw = document.getElementById('pw-new').value;
  const newPw2 = document.getElementById('pw-new2').value;
  const err = document.getElementById('pw-err');
  const saved = getSavedPw();
  if(!saved){ err.textContent='尚未设置密码'; return; }
  if(hashPw(oldPw) !== saved){ err.textContent='当前密码错误'; return; }
  if(!newPw || newPw.length<4){ err.textContent='新密码至少4位'; return; }
  if(newPw !== newPw2){ err.textContent='两次新密码不一致'; return; }
  localStorage.setItem(PW_KEY, hashPw(newPw));
  closeModal('pw-modal');
  document.getElementById('pw-old').value='';
  document.getElementById('pw-new').value='';
  document.getElementById('pw-new2').value='';
  err.textContent='';
  toast('✓ 密码已修改');
}

// ─── INIT ─────────────────────────────────────────
initEntry();renderHome();initFirebase();initLogin();
